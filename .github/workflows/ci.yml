name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build WindowsSecretManager.sln -c Release

      - name: Run tests
        run: dotnet run --project tests/WindowsSecretManager.Tests/WindowsSecretManager.Tests.csproj -c Release
