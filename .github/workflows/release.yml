name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from installer script
        id: version
        shell: pwsh
        run: |
          $content = Get-Content installer\CodexVault.iss -Raw
          if ($content -notmatch '#define AppVersion "([^"]+)"') {
            throw "Could not find AppVersion in installer/CodexVault.iss"
          }
          $version = $Matches[1]
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches installer version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v${{ steps.version.outputs.version }}"
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match installer/CodexVault.iss AppVersion ('$expected'). Bump the version and commit before tagging."
          }

      - name: Run tests
        run: dotnet run --project tests/WindowsSecretManager.Tests/WindowsSecretManager.Tests.csproj -c Release

      - name: Publish App (self-contained, win-x64)
        run: dotnet publish src/WindowsSecretManager.App/WindowsSecretManager.App.csproj -c Release -r win-x64 --self-contained true -o "work/installer-publish-${{ steps.version.outputs.version }}"

      - name: Publish CLI (self-contained, win-x64)
        run: dotnet publish src/WindowsSecretManager.Cli/WindowsSecretManager.Cli.csproj -c Release -r win-x64 --self-contained true -o "work/installer-publish-${{ steps.version.outputs.version }}"

      - name: Remove debug symbols from publish output
        shell: pwsh
        run: Get-ChildItem -Path "work/installer-publish-${{ steps.version.outputs.version }}" -Filter '*.pdb' -Recurse | Remove-Item -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc "installer\CodexVault.iss"

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path "work/installer-publish-${{ steps.version.outputs.version }}/*" -DestinationPath "outputs/CodexVault-${{ steps.version.outputs.version }}-win-x64.zip" -Force

      - name: Compute checksums
        shell: bash
        run: |
          cd outputs
          sha256sum "CodexVault-Setup-${{ steps.version.outputs.version }}-win-x64.exe" "CodexVault-${{ steps.version.outputs.version }}-win-x64.zip" > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          awk "/^## ${{ steps.version.outputs.version }} /{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Could not find a '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "Codex Vault ${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md `
            "outputs/CodexVault-Setup-${{ steps.version.outputs.version }}-win-x64.exe" `
            "outputs/CodexVault-${{ steps.version.outputs.version }}-win-x64.zip" `
            "outputs/SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Upload build artifacts (manual run, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-vault-${{ steps.version.outputs.version }}
          path: |
            outputs/CodexVault-Setup-${{ steps.version.outputs.version }}-win-x64.exe
            outputs/CodexVault-${{ steps.version.outputs.version }}-win-x64.zip
            outputs/SHA256SUMS-${{ steps.version.outputs.version }}.txt
